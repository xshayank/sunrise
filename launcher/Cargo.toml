[package]
name = "sunrise-launcher"
version = "1.0.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"
description = "Downloads, prepares and starts Sunrise builds"

[workspace]
# The copies in crates/ are checked and tested with the launcher.
members = ["crates/addresses", "crates/bench", "crates/friends", "crates/smod", "crates/mcp", "crates/nbt", "crates/release-verify", "crates/resolver", "crates/sdk", "crates/shader-api", "crates/system", "crates/telemetry", "crates/theme"]
default-members = [".", "crates/addresses", "crates/bench", "crates/friends", "crates/smod", "crates/mcp", "crates/nbt", "crates/release-verify", "crates/resolver", "crates/sdk", "crates/shader-api", "crates/system", "crates/telemetry", "crates/theme"]

[dependencies]
# GPUI Fast (longbridge/gpui-fast): Zed's GPUI with retained views and cached scroll layers, under
# its own name. wgpu renders on Linux, not blade (#3812).
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["wayland", "x11", "font-kit"] }
ureq = { version = "2", features = ["json", "tls", "socks-proxy"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks the client jar and the version file found in other launchers' folders (sources.rs).
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
futures-util = "0.3"
httpdate = "1"
# The mod browser checks Modrinth's SHA-512 before a pack reaches the game folder (browser/download.rs).
sha2 = "0.10"
tempfile = "3"
# The secrets file is encrypted where no keychain answers (account.rs, FileStore).
chacha20poly1305 = "0.10"
pulldown-cmark = { version = "0.12", default-features = false }
flate2 = "1"
tar = { version = "0.4", default-features = false }
toml = "1.1"
semver = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "5"
# The system's preferred languages, for the window's language (i18n.rs).
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
sunrise-prepare = { path = "../crates/sunrise-prepare" }
# The launcher's own copies of what it used from the game's crates (crates/), so it can leave the game repository.
sunrise-launcher-addresses = { path = "crates/addresses" }
sunrise-launcher-bench = { path = "crates/bench" }
sunrise-launcher-friends = { path = "crates/friends" }
sunrise-launcher-smod = { path = "crates/smod" }
sunrise-launcher-mcp = { path = "crates/mcp" }
sunrise-launcher-nbt = { path = "crates/nbt" }
sunrise-launcher-release-verify = { path = "crates/release-verify" }
sunrise-launcher-resolver = { path = "crates/resolver" }
# The SDK index reader and slice unpacker (`native_mods/sdk_cache.rs`).
sunrise-launcher-sdk = { path = "crates/sdk" }
sunrise-launcher-shader-api = { path = "crates/shader-api" }
sunrise-launcher-system = { path = "crates/system" }
sunrise-launcher-telemetry = { path = "crates/telemetry" }
sunrise-launcher-theme = { path = "crates/theme" }
# The sunset scene, painted skies, rain and frosted glass (`scenery/`).
sunrise-launcher-scenery = { path = "scenery" }
# The engine, through the platform's public API (docs/layers.md): the preparer.
sunrise-platform = { path = "../crates/sunrise-platform", features = ["prepare"] }
# Parses proxy and download addresses (`net.rs`); already in the lockfile through ureq.
url = "2"
# Deleting a world moves it to the system's trash
trash = "5"
# Backup names carry the local time, as vanilla's do
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The session file's random name.
getrandom = "0.3"
# Players' heads on the Servers page, from the default skins in the player's own game files (already
# in the lockfile through gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Screenshots read a row at a time and shrunk as they come (`pictures`): the version `image` uses.
png = "0.18"
cap-std = "3"
cap-fs-ext = "3"

# Native builds at low priority (rust_toolchain::low_priority); already in the lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Microsoft account secrets in the OS keychain: the Secret Service on Linux through oo7 (the same
# build gpui uses), Keychain and Credential Manager through keyring.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# The GPU's texture limit, which caps the pictures made for GPUI's atlas (`pictures::gpu_limit`): the
# wgpu GPUI itself uses on Linux.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "gles"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Decode Keychain OSStatus errors without matching localized error strings (account.rs).
security-framework = "3"
# Painting the window's title bar dark or light (titlebar::apply_appearance), and the system's
# reduced motion (sky::moves): crates already in the lockfile through gpui and wgpu.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSView", "NSWindow", "NSWorkspace"] }
raw-window-handle = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Java's heap slider reads the computer's memory; the uninstaller hides its running copy; an
# abandoned launcher update is one whose process has gone. Already in the lockfile.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Shortcuts written by the shell itself (shortcut::write_windows_link): the hand-laid Shell Link has
# no target ID list, so Explorer shows an empty target and starts nothing.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
# Per-user setup: the Uninstall entry and the launcher's own key under HKCU (installer.rs).
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

[dev-dependencies]
sunrise-launcher-release-verify = { path = "crates/release-verify", features = ["signing"] }
libc = "0.2"
# Tokenize source strings for the translation completeness test, including multiline calls.
syn = "2"
proc-macro2 = "1"

[profile.release]
strip = true

# The scenery's pixel loops (blurring a sky, baking the frosted plates) are optimised in debug
# builds too: unoptimised, one Blur step took 0.7-1 s and one Glass step 70 ms.
[profile.dev.package.sunrise-launcher-scenery]
opt-level = 3
